
name: Build LiquidGlassCC

on:
  workflow_dispatch:
  push:
    paths:
      - "LiquidGlassCC-source.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract project
        run: |
          unzip -q LiquidGlassCC-source.zip -d source
          test -f source/LiquidGlassCC/app/build.gradle.kts

      - name: Compile APK
        working-directory: source/LiquidGlassCC
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassCC-debug
          path: source/LiquidGlassCC/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
